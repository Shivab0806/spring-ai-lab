spring:
  application:
    name: spring-ai-lab

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3-flash-preview
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: llama3.2:3b
logging:
  level:
    root: INFO
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG



